schema: work-library-publication/0
case_id: bealls-aisles
adapter: git-manifest
canonical_output: prototype-overview

catalog:
  title: Bealls Aisles
  subtitle: Aisles case family · Working R&D prototype
  family: aisles
  family_label: Aisles case family
  question: What does Bealls Aisles actually prove about safe AI-composed storefronts?
  summary: One engine can serve multiple brands and page structures. The reusable asset is the graduated composition-latitude contract, not merchant-outcome evidence.

collection_candidates:
  - commerce

publication:
  status: draft
  clearance: internal
  assurance:
    human_validation: pending

outputs:
  - id: prototype-overview
    type: repository-overview
    status: draft
    artifact: docs/work-library/prototype-overview.md
    clearance: internal
    assurance:
      human_validation: pending
  - id: composition-taxonomy
    type: strategy-reference
    status: draft
    artifact: docs/architecture/engine/composition-taxonomy.md
    clearance: internal
    assurance:
      human_validation: pending

projections:
  # kind values come from the library's controlled vocabulary —
  # work-library/docs/ONTOLOGY.md. It decides which rail group a document
  # lands in; render_as is only the renderer.
  # Reclassified from the proposed `history`: the document doesn't preserve
  # lineage or superseded work, it orients a current reader — "Use this case
  # to inspect the working prototype... Use the linked Aisles
  # competitive-position case for the investment decision."
  - id: prototype-overview
    output: prototype-overview
    artifact: docs/work-library/prototype-overview.md
    render_as: markdown-document
    kind: brief
    label: Prototype overview
    route: /
  # "This document defines that contract. It is the spec that all subsequent
  # schema, prompt, and renderer work should derive from." — binds the shape
  # of a system to build, confirming the proposed `specification`.
  - id: composition-taxonomy
    output: composition-taxonomy
    artifact: docs/architecture/engine/composition-taxonomy.md
    render_as: markdown-document
    kind: specification
    label: Composition latitude and block taxonomy
    route: /strategy/composition-latitude

exclude:
  - .env*
  - docs/deployment/**
  - scripts/.DS_Store
  - src/.DS_Store
