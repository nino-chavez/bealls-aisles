name = "aisles-demo"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[env.bealls]
name = "aisles-demo-1"
vars = { BRAND_ID = "bealls", CF_AIG_GATEWAY_ID = "aisles-bealls" }

[env.bealls-fl]
name = "aisles-demo-2"
# BRAND_ID values match BRANDS dict keys in src/lib/brand/config.ts (no hyphens).
# Wrangler env name keeps the hyphenated form for CLI ergonomics.
vars = { BRAND_ID = "beallsflorida", CF_AIG_GATEWAY_ID = "aisles-bealls-fl" }

[env.home-centric]
name = "aisles-demo-3"
vars = { BRAND_ID = "homecentric", CF_AIG_GATEWAY_ID = "aisles-hc" }

[env.sleepcountry]
name = "aisles-demo-4"
# Reuses the same cdfqf9k6zf store as bealls/beallsflorida — but BC products
# are isolated by categoryPrefix='SleepCountry' (see brand/config.ts) so the
# brand-scoped seeder cannot reach Bealls/BF/HC products.
vars = { BRAND_ID = "sleepcountry", CF_AIG_GATEWAY_ID = "aisles-sleepcountry" }
